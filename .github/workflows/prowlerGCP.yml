name: Prowler Reusable Workflow

on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      cloud_provider:
        required: true
        type: string
        default: gcp
        description: 'Cloud Provider'
      gcp_project_id:
        required: true
        type: string
        description: 'GCP Project ID'
      access_token_lifetime:
        required: false
        type: number
        default: 300
        description: 'Duration for which an access token remains valid.'
      role_duration_seconds:
        required: false
        type: number
        default: 900
        description: 'Duration of the session.'
      retention_days:
        required: false
        type: number
        default: 1
        description: 'Duration of the reports retention period.'
      enable_gcs_upload:
        required: false
        type: boolean
        default: false
        description: 'Enable this to upload the reports to GCS bucket.'
      enable_slack_notification:
        required: false
        type: boolean
        default: false
        description: 'Enable Slack notifications for workflow results.'
      SLACK_MESSAGE:
        required: false
        type: string
        default: 'Updated prowler workflow notification'
        description: 'Message to display in Slack Notification'
      SLACK_ENV:
        required: false
        type: string
        default: ''
        description: 'Workflow Environment to show in Slack Notification'

    secrets:
      GCP_PROJECT_ID:
        required: true
        description: 'GCP Project ID'
      GCP_PROJECT_NUMBER:
        required: true
        description: 'GCP Project Number'
      SERVICE_ACCOUNT:
        required: true
        description: 'Google Cloud Service Account Email'
      WIP:
        required: true
        description: 'Workload Identity Provider name'
      Your_WIP_Name:
        required: true
        description: 'Workload Identity Pool Name'
      Your_Provider_Name:
        required: true
        description: 'Workload Identity Pool Provider Name'
      GITHUB_REPO:
        required: true
        description: 'GitHub repository name'
      GCS_BUCKET_NAME:
        required: false
        description: 'GCS bucket to store the prowler reports'
      SLACK_WEBHOOK:
        required: false
        description: 'Slack Webhook URL'
      SLACK_USERNAME:
        required: false
        description: 'Slack username for notifications'
      GCP_CREDENTIALS:  # Add this secret to the list
        required: true
        description: 'Service account credentials for Google Cloud'

jobs:
  prowler:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Authenticate with Google Cloud using Workload Identity Federation
        uses: google-github-actions/auth@v1
        with:
          token_format: access_token
          workload_identity_provider: "projects/295233741425/locations/global/workloadIdentityPools/prowler/providers/reposrts"
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
          access_token_lifetime: 300s
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          
      - name: Debug Google Cloud Project
        run: |
          echo "GCP Project ID: ${{ secrets.GCP_PROJECT_ID }}"
          gcloud auth list
          gcloud projects describe ${{ secrets.GCP_PROJECT_ID }}


      - name: Install pip and Prowler
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip
          python3 -m pip install --upgrade pip
          pip3 install prowler

      - name: Run Prowler for GCP and Generate Reports
        run: |
          # Get the current month
          export MONTH_NAME=$(date +%B)

          # Define the output directory for the reports
          OUTPUT_DIR="/home/runner/work/prowler/prowler/output/$MONTH_NAME"

          # Create the output directory if it doesn't exist
          mkdir -p "$OUTPUT_DIR"

          # Run Prowler with specified output modes
          PROWLER_CMD="prowler gcp --output-directory $OUTPUT_DIR --output-modes html csv json-asff"

          # Execute the Prowler command
          eval $PROWLER_CMD

          # Define report filenames
          REPORT_HTML="$OUTPUT_DIR/prowler-output-default-$(date +'%Y%m%d%H%M%S').html"
          REPORT_CSV="$OUTPUT_DIR/prowler-output-default-$(date +'%Y%m%d%H%M%S').csv"
          REPORT_JSON="$OUTPUT_DIR/prowler-output-default-$(date +'%Y%m%d%H%M%S').asff.json"

          # Check if reports were generated and upload them
          if [ -f "$REPORT_HTML" ] && [ -f "$REPORT_CSV" ] && [ -f "$REPORT_JSON" ]; then
            echo "Reports generated. Uploading to GCS..."

            # Upload the reports to your Google Cloud Storage bucket
            gsutil cp "$REPORT_HTML" gs://your-bucket-name/reports/
            gsutil cp "$REPORT_CSV" gs://your-bucket-name/reports/
            gsutil cp "$REPORT_JSON" gs://your-bucket-name/reports/

            echo "Reports successfully uploaded to GCS."
          else
            echo "Error: Reports were not generated!"
            exit 1
          fi

      - name: Clean up
        run: |
          echo "Cleaning up..."
          # Any additional cleanup tasks (e.g., removing temporary files) can be added here.
          
