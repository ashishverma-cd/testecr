name: Prowler Reusable Workflow

on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      cloud_provider:
        required: true
        type: string
        default: gcp
        description: 'Cloud Provider'
      gcp_project_id:
        required: true
        type: string
        description: 'GCP Project ID'
      access_token_lifetime:
        required: false
        type: number
        default: 300
        description: 'Duration for which an access token remains valid.'
      role_duration_seconds:
        required: false
        type: number
        default: 900
        description: 'Duration of the session.'
      retention_days:
        required: false
        type: number
        default: 1
        description: 'Duration of the reports retention period.'
      enable_gcs_upload:
        required: false
        type: boolean
        default: false
        description: 'Enable this to upload the reports to GCS bucket.'
      enable_slack_notification:
        required: false
        type: boolean
        default: false
        description: 'Enable Slack notifications for workflow results.'
      SLACK_MESSAGE:
        required: false
        type: string
        default: 'Updated prowler workflow notification'
        description: 'Message to display in Slack Notification'
      SLACK_ENV:
        required: false
        type: string
        default: ''
        description: 'Workflow Environment to show in Slack Notification'

    secrets:
      GCP_PROJECT_ID:
        required: true
        description: 'GCP Project ID'
      GCP_PROJECT_NUMBER:
        required: true
        description: 'GCP Project Number'
      GCP_CREDENTIALS:
        required: true
        description: 'Google Cloud Service Account JSON key'
      WIP:
        required: true
        description: 'Workload Identity Provider name'
      Your_WIP_Name:
        required: true
        description: 'Workload Identity Pool Name'
      Your_Provider_Name:
        required: true
        description: 'Workload Identity Pool Provider Name'
      GITHUB_REPO:
        required: true
        description: 'GitHub repository name'
      GCS_BUCKET_NAME:
        required: false
        description: 'GCS bucket to store the prowler reports'
      SLACK_WEBHOOK:
        required: false
        description: 'Slack Webhook URL'
      SLACK_USERNAME:
        required: false
        description: 'Slack username for notifications'

jobs:
  prowler:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Authenticate with Google Cloud using Service Account JSON
        run: |
          echo "${{ secrets.GCP_CREDENTIALS }}" > /tmp/gcp_credentials.json
          gcloud auth activate-service-account --key-file=/tmp/gcp_credentials.json
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
      
      - name: Install Google Cloud SDK
        run: |
          echo "Installing Google Cloud SDK..."
          curl https://sdk.cloud.google.com | bash
          source $HOME/google-cloud-sdk/path.bash.inc
          # No need to authenticate again since we've done it earlier
          gcloud config set project ${{ inputs.gcp_project_id }}


