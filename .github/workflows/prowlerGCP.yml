name: Prowler Reusable Workflow

on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      cloud_provider:
        required: true
        type: string
        default: gcp
        description: 'Cloud Provider'
      gcp_project_id:
        required: true
        type: string
        description: 'GCP Project ID'
      access_token_lifetime:
        required: false
        type: number
        default: 300
        description: 'Duration for which an access token remains valid.'
      role_duration_seconds:
        required: false
        type: number
        default: 900
        description: 'Duration of the session.'
      retention_days:
        required: false
        type: number
        default: 1
        description: 'Duration of the reports retention period.'
      enable_gcs_upload:
        required: false
        type: boolean
        default: false
        description: 'Enable this to upload the reports to GCS bucket.'
      enable_slack_notification:
        required: false
        type: boolean
        default: false
        description: 'Enable Slack notifications for workflow results.'
      SLACK_MESSAGE:
        required: false
        type: string
        default: 'Updated prowler workflow notification'
        description: 'Message to display in Slack Notification'
      SLACK_ENV:
        required: false
        type: string
        default: ''
        description: 'Workflow Environment to show in Slack Notification'

    secrets:
      GCP_PROJECT_ID:
        required: true
        description: 'GCP Project ID'
      GCP_PROJECT_NUMBER:
        required: true
        description: 'GCP Project Number'
      SERVICE_ACCOUNT:
        required: true
        description: 'Google Cloud Service Account Email'
      WIP:
        required: true
        description: 'Workload Identity Provider name'
      Your_WIP_Name:
        required: true
        description: 'Workload Identity Pool Name'
      Your_Provider_Name:
        required: true
        description: 'Workload Identity Pool Provider Name'
      GITHUB_REPO:
        required: true
        description: 'GitHub repository name'
      GCS_BUCKET_NAME:
        required: false
        description: 'GCS bucket to store the prowler reports'
      SLACK_WEBHOOK:
        required: false
        description: 'Slack Webhook URL'
      SLACK_USERNAME:
        required: false
        description: 'Slack username for notifications'
      GCP_CREDENTIALS:
        required: true
        description: 'Service account credentials for Google Cloud'

jobs:
  prowler:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Authenticate with Google Cloud using Workload Identity Federation
        uses: google-github-actions/auth@v1
        with:
          token_format: access_token
          workload_identity_provider: "projects/295233741425/locations/global/workloadIdentityPools/prowler/providers/reposrts"
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
          access_token_lifetime: 300s
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Install pip
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip

      - name: Install Prowler
        run: |
          python3 -m pip install --upgrade pip
          pip3 install prowler

      - name: Running Prowler for GCP
        env:
          PROJECT_ID: ${{ inputs.gcp_project_id }}
        run: |
          # Get the current month, day, year, hour, minute, and second
          export DATE_TIME=$(date +'%B-%d-%Y_%H-%M-%S')
          
          for PROJECTID in $PROJECT_ID; do
            echo "Scanning GCP Project: $PROJECTID"
            
            # Run Prowler command with updated directory path
            PROWLER_CMD="prowler gcp \
              --project-id ${PROJECTID} \
              --output-directory /home/runner/work/prowler/prowler/output/$DATE_TIME \
              --output-modes html csv json-asff \
              --ignore-exit-code-3"
              
            eval $PROWLER_CMD
          done
    
      - name: Upload Artifact
        if: ${{ inputs.enable_gcs_upload == false }}
        uses: actions/upload-artifact@v4
        with:
          name: prowler-reports
          path: /home/runner/work/prowler/prowler/output/
    
      - name: Upload Prowler Results to GCS
        if: ${{ inputs.enable_gcs_upload == true }}
        run: |
          YEAR=$(date +'%Y')
          MONTH=$(date +'%m')
          # Copy reports to GCS bucket with year/month structure
          gsutil cp -r /home/runner/work/prowler/prowler/output/ gs://${{ secrets.GCS_BUCKET_NAME }}/$YEAR/$MONTH/
    
      - name: 'Notify Slack'
        uses: clouddrove/action-slack-notify@1
        if: ${{ inputs.enable_slack_notification == true }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: ${{ inputs.SLACK_MESSAGE }}
          SLACK_ENV: ${{ inputs.SLACK_ENV }}
          SLACK_USERNAME: ${{ secrets.SLACK_USERNAME }}
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || job.status == 'failure' && 'danger' || 'warning' }}
