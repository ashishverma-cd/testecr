name: Build and Push Image to AWS ECR

# on:
#   push:
#     branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.TOKEN }}

      - name: Configure AWS Credentials for ECR
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE }}
          role-session-name: akontest
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Docker Image to ECR
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: "here need to add ecr ecr url with tag"

      - name: Build, Tag, and Push the Image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: "add here ecr url"
          ECR_REPOSITORY: testecr
          IMAGE_TAG: ${{ github.sha }}  # Set IMAGE_TAG to latest commit ID
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  validate-helm:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS Credentials for Helm
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE }}
          role-session-name: helm-deploy
          aws-region: us-east-1

      - name: Deploy to EKS
        uses: koslibpro/helm-eks-action@master
        with:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
      - run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --kubeconfig eksconfig.yaml
          export KUBECONFIG=eksconfig.yaml
          helm upgrade --install my-app ./helm/sample-node-app \
            --namespace my-app \
            --set image.repository="here need to add ECR url" \
            --set image.tag=latest \
            --set image.pullSecrets[0].name=ecr-secret
          rm eksconfig.yaml
