name: Build and Push to Amazon ECR

on:
  push:
    branches:
      - main
 

# env:
#   ECR_REPO: 940482429350.dkr.ecr.us-west-2.amazonaws.com/sample-app
#   AWS_REGION: us-west-2

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      # Configure AWS credentials
      - name: Configure AWS CLI
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set default.region ${{ env.AWS_REGION }}

      # Login to Amazon ECR
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1
        with:
          region: ${{ env.AWS_REGION }}
      
      - name: Build Docker Image
        run: |
          docker build -t sample-app:latest ./  # Build the image with the correct tag 
      - name: Tag Docker Image for ECR
        run: |
          docker tag sample-app:latest 940482429350.dkr.ecr.us-west-2.amazonaws.com/sample-app # Tag it for your ECR repository
      
       - name: Push Docker Image to Amazon ECR
        run: |
          docker push 940482429350.dkr.ecr.us-west-2.amazonaws.com/sample-app  # Push the correctly tagged image to ECR     
      


  validate-helm:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Helm
        run: |
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          ./get_helm.sh

      - name: Helm Lint
        run: helm lint ./helm/sample-node-app

      - name: Helm Template
        run: helm template sample-node-app ./helm/sample-node-app > rendered.yaml
