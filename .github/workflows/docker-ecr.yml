name: Build and Push Image to AWS ECR
on:
  push:
    branches: [ main ]
jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1
      
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile
        push: true
        tags: 924144197303.dkr.ecr.us-east-1.amazonaws.com/test:latest

    - name: Build, Tag, and Push the Image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: 924144197303.dkr.ecr.us-east-1.amazonaws.com
        ECR_REPOSITORY: test
        IMAGE_TAG: ${{ github.sha }}  # Set IMAGE_TAG to latest commit ID
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  validate-helm:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Helm
        run: |
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          ./get_helm.sh
          
      - name: Helm Lint
        run: helm lint ./helm/sample-node-app

      - name: Helm Template
        run: helm template sample-node-app ./helm/sample-node-app > rendered.yaml

      - name: Deploy Application with Helm
        run: |
        helm upgrade --install sample-node-app ./helm/sample-node-app \
          --set image.tag=${{ github.sha }} \  # Pass dynamic values
          --set someValue=${{ secrets.SOME_SECRET }} \  # Example of passing a secret
          --set anotherValue=dynamic-value  # Hardcoded or dynamic value


