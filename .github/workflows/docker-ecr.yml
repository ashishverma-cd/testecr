name: Build and Push to Amazon ECR

on:
  push:
    branches:
      - main

env:
  ECR_REPO: 924144197303.dkr.ecr.us-east-1.amazonaws.com/test
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::924144197303:role/docker-ec2-ecr-role  # ARN of the role to assume

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Configure AWS Credentials (Assume Role)
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ env.ROLE_ARN }}  # Assuming the IAM role here
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1
        with:
          region: ${{ env.AWS_REGION }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.ECR_REPO }}:latest

  validate-helm:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Helm
        run: |
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          ./get_helm.sh

      - name: Helm Lint
        run: helm lint ./helm/sample-node-app

      - name: Helm Template
        run: helm template sample-node-app ./helm/sample-node-app > rendered.yaml
