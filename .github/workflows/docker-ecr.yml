name: Build and Push Image to AWS ECR

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE }}
          role-session-name: github-actions
          aws-region: eu-north-1
##
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: 924144197303.dkr.ecr.us-east-1.amazonaws.com/test:latest

      - name: Build, Tag, and Push the Image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: 924144197303.dkr.ecr.us-east-1.amazonaws.com
          ECR_REPOSITORY: test
          IMAGE_TAG: ${{ github.sha }}  # Set IMAGE_TAG to latest commit ID
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  validate-helm:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Helm
        run: |
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          ./get_helm.sh
          
      - name: Helm Lint
        run: helm lint ./helm/sample-node-app

      - name: Helm Template
        run: helm template sample-node-app ./helm/sample-node-app > rendered.yaml

      # Step to update kubeconfig for demo-cluster2
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name demo-cluster2 --kubeconfig eksconfig.yaml

      # Step to deploy to EKS using Helm
      - name: Deploy Application with Helm
        uses: koslibpro/helm-eks-action@master
        with:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}

      # Helm upgrade/install command
      - name: Deploy to EKS
        run: |
          export KUBECONFIG=eksconfig.yaml
          helm upgrade \
            --install ${{ env.ENVIRONMENT }}-sample-node-app \
            ./helm/sample-node-app \
            --set image.repository=${{ env.IMAGE }} \
            --set image.tag=${{ env.VERSION }} \
            -n ${{ env.ENVIRONMENT }}
