name: Build and Push Image to AWS ECR

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write


jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.TOKEN }}

      - name: Configure AWS Credentials for ECR
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE }}
          role-session-name: akontest
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Docker Image to ECR
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: 924144197303.dkr.ecr.us-east-1.amazonaws.com/testecr:latest

      - name: Build, Tag, and Push the Image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: 924144197303.dkr.ecr.us-east-1.amazonaws.com
          ECR_REPOSITORY: testecr
          IMAGE_TAG: ${{ github.sha }}  # Set IMAGE_TAG to latest commit ID
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  validate-helm:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Helm
        run: |
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          ./get_helm.sh

      - name: Configure AWS Credentials for Helm
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE }}
          role-session-name: helm-deploy
          aws-region: us-east-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --kubeconfig eksconfig.yaml      
      
           

      - name: Deploy Helm Chart
        run: |
          helm upgrade --install my-app ./helm/sample-node-app \
            --namespace my-app \
            --set image.repository=924144197303.dkr.ecr.us-east-1.amazonaws.com/testecr \
            --set image.tag=${{ github.sha }} \
            --set image.pullSecrets[0].name=ecr-secret
